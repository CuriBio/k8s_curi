apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: "--cluster-name=prod-v2"
    target:
      group: apps
      kind: Deployment
      name: aws-load-balancer-controller
      version: v1
  - patch: |-
      - op: replace
        path: /spec/tls
        value: [{"hosts": ["*.curibio.com"]}]
    target:
      kind: Ingress
      name: alb-nginx-ingress
      namespace: nginx-ingress
  - patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1wafv2-acl-arn
        value: arn:aws:wafv2:us-east-2:245339368379:regional/webacl/api-tier1-count/420e276d-4de6-4f5b-8b4b-20c0ea8395aa
    target:
      kind: Ingress
      name: alb-nginx-ingress
      namespace: nginx-ingress
