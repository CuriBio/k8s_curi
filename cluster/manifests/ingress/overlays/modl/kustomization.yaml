apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: "--cluster-name=modl-v2"
    target:
      group: apps
      kind: Deployment
      name: aws-load-balancer-controller
      version: v1
  - patch: |-
      - op: replace
        path: /spec/tls
        value: [{"hosts": ["*.curibio-modl.com"]}]
    target:
      kind: Ingress
      name: alb-nginx-ingress
      namespace: nginx-ingress
  - patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1wafv2-acl-arn
        value: arn:aws:wafv2:us-east-2:725604423866:regional/webacl/api-tier1-count/16b778b5-c4a2-4f07-9d36-1c0f84c1df2d
    target:
      kind: Ingress
      name: alb-nginx-ingress
      namespace: nginx-ingress
